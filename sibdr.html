<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InfoChat – Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f3ee;
      margin: 0;
      padding: 0;
    }
    .chat-container {
      max-width: 700px;
      margin: 50px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .messages {
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 8px;
    }
    .msg {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
    }
    .msg.user {
      background: #cdb6a2;
      color: #fff;
      margin-left: auto;
    }
    .msg.bot {
      background: #f2ece7;
      color: #333;
    }
    form {
      display: flex;
      margin-top: 15px;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #a9886f;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
  </style>
</head>

<body>
  <div class="chat-container">
    <h2>💬 InfoChat</h2>
    <div id="messages" class="messages">
      <div class="msg bot">Bonjour 👋, je suis InfoChat. Posez votre question.</div>
    </div>

    <form id="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Écrivez votre message..." />
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('composer');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    function addMsg(text, who = 'bot') {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.innerHTML = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function handleBotReply(text) {
      try {
        const response = await fetch("backend.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        addMsg(data.reply, 'bot');
      } catch (error) {
        console.error("Erreur :", error);
        addMsg("⚠️ Impossible de contacter le serveur.", 'bot');
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      addMsg(t, 'user');
      input.value = '';
      handleBotReply(t);
    });
  </script>

  

</body>
</html>
